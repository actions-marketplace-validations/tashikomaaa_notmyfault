# notmyfault in GitLab CI/CD: https://github.com/tashikomaaa/notmyfault/blob/main/docs/gitlab.md
#
# include:
#   - remote: https://raw.githubusercontent.com/tashikomaaa/notmyfault/v1/templates/notmyfault.gitlab-ci.yml
#
# notmyfault:
#   extends: .notmyfault
#   needs: [test]              # the job writing the JUnit reports, as artifacts:paths
#   variables:
#     NOTMYFAULT_JUNIT: reports/*.xml
#
# pages:                       # publishes the history pages with GitLab Pages
#   extends: .notmyfault-pages
#   needs: [notmyfault]
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.notmyfault:
  image: node:24-alpine
  stage: .post
  # Test failures are what notmyfault explains.
  when: always
  variables:
    # The version of notmyfault, pinned to the release this template comes from, with the checksum of its bundle.
    # Changing NOTMYFAULT_REF without its NOTMYFAULT_SHA256 fails the job: set both, or neither.
    NOTMYFAULT_REF: v1.12.0
    NOTMYFAULT_SHA256: 655e709014892a3d63f9f09dd54f33c02f51ce42df51dc222285924fe3c4eac9
  script:
    # notmyfault stores its history with git, which node:24-alpine lacks.
    - command -v git > /dev/null || apk add --no-cache git
    # A ref is a tag or a commit: anything else could walk out of the repository with ../.
    - case "$NOTMYFAULT_REF" in *[!A-Za-z0-9._-]*) echo "NOTMYFAULT_REF must be a tag or a commit"; exit 1;; esac
    - wget -q -O /tmp/notmyfault.mjs "https://raw.githubusercontent.com/tashikomaaa/notmyfault/${NOTMYFAULT_REF}/dist/notmyfault.mjs"
    # Only the file published with that release runs. Empty means "no check", which the job refuses by default.
    - test -n "$NOTMYFAULT_SHA256" || { echo "NOTMYFAULT_SHA256 is empty: set it to the checksum of the release in NOTMYFAULT_REF"; exit 1; }
    - echo "$NOTMYFAULT_SHA256  /tmp/notmyfault.mjs" | sha256sum -c -
    - node /tmp/notmyfault.mjs
  artifacts:
    when: always
    expose_as: notmyfault report
    paths: [notmyfault-summary.md]
    reports:
      codequality: gl-code-quality-report.json
      dotenv: notmyfault.env

# The pages notmyfault writes on the history branch, as a GitLab Pages site.
.notmyfault-pages:
  image: alpine:3
  stage: .post
  variables:
    NOTMYFAULT_HISTORY_BRANCH: notmyfault-history
  script:
    - command -v git > /dev/null || apk add --no-cache git
    - git fetch --quiet --depth 1 origin "$NOTMYFAULT_HISTORY_BRANCH"
    - mkdir -p public
    - git --work-tree=public checkout FETCH_HEAD -- index.html reports badges
  artifacts:
    paths: [public]
