name: Release assets

# Rebuilds the bundles of a release from its tag, checks that they are the
# committed ones, attests their build provenance and attaches notmyfault.mjs
# with its checksum. Re-run it on a tag with: gh workflow run release.yml --ref vX.Y.Z
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write       # attach the assets to the release
  id-token: write       # sign the attestations
  attestations: write   # store them

jobs:
  assets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment only opens for tags named v*, so the tokens it holds are
    # out of reach of a run on a branch.
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the GitLab mirror.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Check that the bundles and the pinned template are the committed ones
        run: |
          if ! git diff --quiet -- dist/ templates/; then
            echo "::error::dist/ or templates/ at $TAG does not match its sources."
            exit 1
          fi
          if ! grep -q "NOTMYFAULT_REF: $TAG" templates/notmyfault.gitlab-ci.yml; then
            echo "::error::templates/notmyfault.gitlab-ci.yml does not pin $TAG."
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/index.js
            dist/notmyfault.mjs
            dist/dashboard.js

      - name: Attach notmyfault.mjs and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum notmyfault.mjs > notmyfault.mjs.sha256
          gh release upload "$TAG" notmyfault.mjs notmyfault.mjs.sha256 --clobber
          checksum=$(cut -d ' ' -f 1 notmyfault.mjs.sha256)
          notes=$(gh release view "$TAG" --json body --jq .body)
          if ! grep -q "$checksum" <<< "$notes"; then
            printf '%s\n\n**SHA-256 of notmyfault.mjs:** `%s`\n' "$notes" "$checksum" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      # The GitLab mirror publishes the component to the CI/CD Catalog when it gets the tag.
      # Skipped until the GITLAB_MIRROR_URL variable and the GITLAB_MIRROR_TOKEN secret exist.
      - name: Push to the GitLab mirror
        env:
          MIRROR_URL: ${{ vars.GITLAB_MIRROR_URL }}
          MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_URL" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::No GitLab mirror configured: the component is not published to the CI/CD Catalog."
            exit 0
          fi
          case "$MIRROR_URL" in https://*) ;; *) echo "::error::GITLAB_MIRROR_URL must be an https URL."; exit 1;; esac
          # The credential goes through the environment, scoped to the host of the mirror, as git-store does.
          origin=$(printf '%s' "$MIRROR_URL" | cut -d/ -f1-3)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$origin/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'oauth2:%s' "$MIRROR_TOKEN" | base64 -w0)"
          # main without a pipeline, then the tag alone, whose pipeline creates the release.
          git push -o ci.skip "$MIRROR_URL" origin/main:refs/heads/main
          git push "$MIRROR_URL" "refs/tags/$TAG:refs/tags/$TAG"

      # npx notmyfault, for CI systems without an integration. Skipped until the NPM_TOKEN secret exists.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: notmyfault is not published to npm."
            exit 0
          fi
          if [ "v$(node -p 'require("./package.json").version')" != "$TAG" ]; then
            echo "::error::package.json is not at version $TAG."
            exit 1
          fi
          if npm view "notmyfault@${TAG#v}" version > /dev/null 2>&1; then
            echo "notmyfault ${TAG#v} is already on npm."
          else
            npm publish --provenance --access public
          fi
