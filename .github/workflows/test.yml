name: Test

# The test job, called by CI with the permissions its event deserves.
on:
  workflow_call:
    inputs:
      record:
        description: Whether notmyfault records the run in the history branch.
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check that dist/ and the pinned template are up to date
        run: |
          if ! git diff --quiet -- dist/ templates/; then
            echo "::error::dist/ or templates/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      # notmyfault checks its own test suite.
      - name: notmyfault
        if: ${{ !cancelled() }}
        uses: ./
        with:
          junit: reports/junit.xml
          # Named, so that both callers share one history whatever the jobs are called.
          key: ci-test
          record: ${{ inputs.record }}
