name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # Only runs on main write the history: a pull request reads it and comments.
  main:
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/test.yml

  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test.yml
    with:
      record: false
