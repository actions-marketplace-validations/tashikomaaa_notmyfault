name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Check that dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      # notmyfault checks its own test suite.
      - name: notmyfault
        if: ${{ !cancelled() }}
        uses: ./
        with:
          junit: reports/junit.xml
